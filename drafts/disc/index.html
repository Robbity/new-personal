<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robbie Laughlen</title>
<link rel="icon" href="/img/bear.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f3f1; --ink: #131313; --mute: #8b8b86; --line: #d6d6d2; --kodak: #f2a25c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.5 "Inter Tight", system-ui, sans-serif; }
  a { color: inherit; }
  .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .02em; text-transform: uppercase; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .hero { position: relative; z-index: 1; height: 100svh; padding: 20px; display: grid; grid-template-rows: auto 1fr auto; pointer-events: none; }
  .hero a { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; gap: 16px; }
  .top nav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
  .top nav a { text-decoration: none; }
  .top nav a:hover { text-decoration: underline; }
  .title { align-self: end; }
  .title h1 { margin: 0; font-weight: 800; font-size: clamp(40px, 8vw, 120px); line-height: .86; letter-spacing: -.055em; }
  .bottom { display: flex; justify-content: space-between; align-items: end; margin-top: 18px; color: var(--mute); }

  main { position: relative; z-index: 1; }
  section { padding: 72px 20px; background: rgba(243, 243, 241, .74); backdrop-filter: blur(26px) saturate(1.2); -webkit-backdrop-filter: blur(26px) saturate(1.2); border-top: 1px solid var(--line); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 36px; }
  h2 { margin: 0; font-size: clamp(28px, 4vw, 48px); font-weight: 700; letter-spacing: -.04em; }
  .wrap { max-width: 1240px; margin: 0 auto; }

  .about { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; }
  .about p { margin: 0; font-size: clamp(18px, 2vw, 24px); line-height: 1.35; letter-spacing: -.01em; }
  dl { margin: 0; }
  dl div { display: grid; grid-template-columns: 9em 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  dt { color: var(--mute); }
  dd { margin: 0; }

  .job { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid var(--line); }
  .job h3 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.02em; }
  .job ul { margin: 0; padding-left: 18px; }
  .job li { margin: 4px 0; }
  .awards { columns: 2; gap: 32px; margin-top: 36px; padding: 0; list-style: none; }
  .awards li { break-inside: avoid; padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; gap: 16px; }
  .awards span { color: var(--mute); }

  /* Contact sheet: film frames */
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
  .frame { display: block; text-decoration: none; background: #0b0b0b; padding: 22px 26px 14px; position: relative; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 18px 30px -18px rgba(0,0,0,.35); }
  .frame:hover { transform: translateY(-6px) rotate(-.6deg); box-shadow: 0 30px 50px -22px rgba(0,0,0,.45); }
  .frame::before, .frame::after { position: absolute; font: 500 10px "IBM Plex Mono", monospace; color: var(--kodak); letter-spacing: .12em; writing-mode: vertical-rl; }
  .frame::before { content: "KODAK E100"; left: 7px; top: 22px; transform: rotate(180deg); }
  .frame::after { content: attr(data-n); right: 7px; top: 22px; }
  .frame img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .frame .cap { color: #e9e9e6; padding-top: 12px; }
  .frame .cap b { display: block; font-weight: 600; font-size: 15px; }
  .frame .cap small { color: #8f8f8a; }

  /* Tracklist */
  .tracks { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  .tracks li { counter-increment: t; border-top: 1px solid var(--line); }
  .tracks a { display: grid; grid-template-columns: 3em 64px 1fr auto; gap: 18px; align-items: center; padding: 14px 0; text-decoration: none; }
  .tracks a::before { content: counter(t, decimal-leading-zero); font: 500 12px "IBM Plex Mono", monospace; color: var(--mute); }
  .tracks img { width: 64px; height: 64px; object-fit: cover; }
  .tracks a:hover b { text-decoration: underline; }
  .tracks p { margin: 2px 0 0; color: var(--mute); }

  .contact { padding-bottom: 40px; }
  .email { display: block; font-size: clamp(30px, 7vw, 104px); font-weight: 800; letter-spacing: -.055em; line-height: 1; text-decoration: none; margin-bottom: 28px; }
  .email:hover { color: #5a5a55; }
  .links { display: flex; gap: 22px; flex-wrap: wrap; }
  footer { display: flex; justify-content: space-between; margin-top: 64px; color: var(--mute); }

  @media (max-width: 760px) {
    .about, .job { grid-template-columns: 1fr; gap: 12px; }
    .awards { columns: 1; }
    .tracks a { grid-template-columns: 2em 52px 1fr; }
    .tracks a > span:last-child { display: none; }
    .tracks img { width: 52px; height: 52px; }
    .top nav { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<header class="hero">
  <div class="top mono">
    <span>RL&nbsp;—&nbsp;CAT. NO. 001</span>
    <nav><a href="#notes">Liner notes</a><a href="#credits">Credits</a><a href="#sheet">Contact sheet</a><a href="#tracks">Tracklist</a><a href="#contact">Contact</a></nav>
  </div>
  <div></div>
  <div>
    <div class="title"><h1 id="name"></h1></div>
    <div class="bottom mono"><span id="tag"></span><span>Scroll ↓</span></div>
  </div>
</header>

<main id="content"></main>

<script type="module">
import { site } from "../data.js";

// ---------- content ----------
const $ = (s) => document.querySelector(s);
$("#name").innerHTML = site.name.replace(" ", "<br>");
$("#tag").textContent = `${site.tagline} — ${site.location}`;

$("#content").innerHTML = `
<section id="notes"><div class="wrap">
  <div class="head"><h2>Liner notes</h2><span class="mono">A / 01</span></div>
  <div class="about"><p>${site.about}</p>
    <dl>${site.facts.map(([k, v]) => `<div><dt class="mono">${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
  </div>
</div></section>

<section id="credits"><div class="wrap">
  <div class="head"><h2>Credits</h2><span class="mono">A / 02</span></div>
  ${site.jobs.map((j) => `<div class="job"><div class="mono">${j.when}<br>${j.org}</div>
    <div><h3>${j.role}, ${j.org}</h3><ul>${j.points.map((p) => `<li>${p}</li>`).join("")}</ul></div></div>`).join("")}
  <ul class="awards">${site.awards.map(([y, a]) => `<li><span class="mono">${y}</span>${a}</li>`).join("")}</ul>
</div></section>

<section id="sheet"><div class="wrap">
  <div class="head"><h2>Contact sheet</h2><span class="mono">B / 01 — Projects</span></div>
  <div class="sheet">${site.projects.map((p, i) => `
    <a class="frame" data-n="${String(i + 12).padStart(2, "0")}A" href="${p.href}" target="_blank" rel="noopener">
      <img src="${p.img}" alt="${p.title}" loading="lazy">
      <div class="cap"><b>${p.title}</b>${p.desc}<br><small class="mono">${p.year} · ${p.stack}</small></div>
    </a>`).join("")}</div>
</div></section>

<section id="tracks"><div class="wrap">
  <div class="head"><h2>Tracklist</h2><span class="mono">B / 02 — Music</span></div>
  <ol class="tracks">${site.music.map((m) => `<li><a href="${m.href}" target="_blank" rel="noopener">
    <img src="${m.img}" alt=""><div><b>${m.title}</b><p>${m.desc}</p></div><span class="mono">${m.year}</span></a></li>`).join("")}</ol>
</div></section>

<section id="contact" class="contact"><div class="wrap">
  <div class="head"><h2>Contact</h2><span class="mono">Side C</span></div>
  <a class="email" href="mailto:${site.email}">${site.email}</a>
  <div class="links mono">${site.links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>
  <footer class="mono"><span>© 2025 ${site.name}</span><a href="#">Top ↑</a></footer>
</div></section>`;

// ---------- scene ----------
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("#stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f3f3f1");
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

// Baked-looking contact shadow: a blurred radial blob on the floor.
function blob(alpha) {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, `rgba(0,0,0,${alpha})`);
  r.addColorStop(0.55, `rgba(0,0,0,${alpha * 0.45})`);
  r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 3.2), new THREE.MeshBasicMaterial({ map: blob(0.28), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(0.15, -1.6, 0.2);
scene.add(shadow);

// --- The disc ---
const ring = (outer, inner) => {
  const s = new THREE.Shape().absarc(0, 0, outer, 0, Math.PI * 2);
  s.holes.push(new THREE.Path().absarc(0, 0, inner, 0, Math.PI * 2, true));
  return s;
};
// Diffraction streaks: a conic rainbow that we counter-rotate so the
// highlight stays put while the disc spins, like a real CD under a lamp.
function diffractionTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const g = c.getContext("2d");
  const cg = g.createConicGradient(0.35, 512, 512);
  const half = [
    [0, "#e6e6e4"], [0.035, "#b9f0d7"], [0.07, "#fff6a8"], [0.1, "#ffffff"], [0.14, "#c6d3ff"],
    [0.18, "#c9c9c9"], [0.24, "#3a3a44"], [0.31, "#16161c"], [0.37, "#4a4a55"], [0.42, "#e9b3f2"], [0.46, "#a6e8ff"], [0.5, "#e6e6e4"],
  ];
  for (const [o, col] of half) { cg.addColorStop(o, col); cg.addColorStop(Math.min(o + 0.5, 1), col); }
  g.fillStyle = cg;
  g.fillRect(0, 0, 1024, 1024);
  // fine grooves
  g.globalAlpha = 0.05;
  for (let r = 160; r < 512; r += 1.6) {
    g.strokeStyle = Math.random() > 0.5 ? "#000" : "#fff";
    g.beginPath(); g.arc(512, 512, r, 0, Math.PI * 2); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.center.set(0.5, 0.5);
  tex.anisotropy = 8;
  return tex;
}
// Map UVs straight from the disc's XY so the texture is centred.
function planarUV(geo, r) {
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / (2 * r) + 0.5, p.getY(i) / (2 * r) + 0.5);
  return geo;
}
const discTex = diffractionTexture();
const disc = new THREE.Group();
const platter = new THREE.Mesh(
  planarUV(new THREE.ExtrudeGeometry(ring(2, 0.62), { depth: 0.025, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2, curveSegments: 160 }), 2),
  new THREE.MeshPhysicalMaterial({ map: discTex, metalness: 0.8, roughness: 0.16, iridescence: 0.5, iridescenceIOR: 1.8, iridescenceThicknessRange: [200, 700], clearcoat: 1, clearcoatRoughness: 0.03 })
);
const hub = new THREE.Mesh(
  new THREE.ExtrudeGeometry(ring(0.62, 0.2), { depth: 0.022, bevelEnabled: false, curveSegments: 96 }),
  new THREE.MeshPhysicalMaterial({ color: 0xf6f6f6, metalness: 0, roughness: 0.25, transmission: 0.85, thickness: 0.05, ior: 1.45 })
);
const label = new THREE.Mesh(
  new THREE.ExtrudeGeometry(ring(0.75, 0.62), { depth: 0.027, bevelEnabled: false, curveSegments: 96 }),
  new THREE.MeshStandardMaterial({ color: 0xd8d8d6, metalness: 0.6, roughness: 0.35 })
);
disc.add(platter, hub, label);
const discRig = new THREE.Group();
discRig.add(disc);
discRig.rotation.x = -Math.PI / 2 + 0.22; // lying almost flat, facing the camera a touch
discRig.position.set(0, -0.55, 0);
scene.add(discRig);

// --- The gatefold: two film frames ---
function filmTexture(src, n) {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#0b0b0b";
  g.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const img = new Image();
  img.onload = () => {
    const x = 74, y = 52, w = 1024 - 148, h = 1024 - 104;
    const s = Math.max(w / img.width, h / img.height);
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
    g.drawImage(img, x + (w - img.width * s) / 2, y + (h - img.height * s) / 2, img.width * s, img.height * s);
    g.restore();
    g.fillStyle = "#f2a25c";
    g.font = "600 24px 'IBM Plex Mono', monospace";
    g.save(); g.translate(46, 900); g.rotate(-Math.PI / 2); g.fillText(`KODAK E100   ${n}`, 0, 0); g.restore();
    g.save(); g.translate(978, 80); g.rotate(Math.PI / 2); g.fillText(`${n + 1}A   ▸`, 0, 0); g.restore();
    tex.needsUpdate = true;
  };
  img.src = src;
  return tex;
}
function filmPanel(src, n, side) {
  const geo = new THREE.PlaneGeometry(2, 2, 24, 1);
  // A slight curl so it reads as paper, not a quad.
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    pos.setZ(i, 0.05 * Math.pow((x + 1) / 2 - (side < 0 ? 0 : 1), 2) * 2);
  }
  geo.computeVertexNormals();
  geo.translate(side * 1, 0, 0); // hinge at x = 0
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: filmTexture(src, n), roughness: 0.5, side: THREE.DoubleSide }));
  return mesh;
}
const fold = new THREE.Group();
const leftP = filmPanel(site.music[1].img, 41, -1);
const rightP = filmPanel(site.music[2].img, 49, 1);
leftP.rotation.y = 0.2;
rightP.rotation.y = -0.2;
fold.add(leftP, rightP);
fold.position.set(0, 1.55, -0.3);
scene.add(fold);

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const pointer = { x: 0, y: 0 };
addEventListener("pointermove", (e) => {
  pointer.x = e.clientX / innerWidth - 0.5;
  pointer.y = e.clientY / innerHeight - 0.5;
});

let spin = 0, lastY = scrollY, boost = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const sy = scrollY;
  boost += Math.abs(sy - lastY) * 0.0006;
  boost *= 0.94;
  lastY = sy;
  const motion = reduce ? 0.15 : 1;

  spin += (0.006 + boost) * motion;
  disc.rotation.z = spin;
  discTex.rotation = -spin + pointer.x * 0.6;
  const bob = Math.sin(t * 0.9) * 0.05 * motion;
  discRig.position.y = -0.55 + bob;
  shadow.material.opacity = 1 - bob * 3;
  shadow.scale.setScalar(1 + bob * 0.8);
  discRig.rotation.y = Math.sin(t * 0.4) * 0.04 * motion;
  fold.position.y = 1.55 + Math.sin(t * 0.7 + 1) * 0.04 * motion;
  fold.rotation.y = Math.sin(t * 0.3) * 0.06 * motion;

  // Portrait screens need the camera pulled back.
  const dist = 11 * Math.max(1, 1.25 / camera.aspect);
  const p = Math.min(sy / innerHeight, 1.5);
  camera.position.set(pointer.x * 1.2, 0.9 + pointer.y * -0.5 + p * 1.6, dist + p * 2);
  camera.lookAt(0, 0.45 - p * 0.4, 0);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
