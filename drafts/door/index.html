<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robbie Laughlen</title>
<link rel="icon" href="/img/bear.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1b1b1a; --mute: #6e6d69; --card: rgba(250, 249, 246, .8); --line: rgba(0,0,0,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #151412; color: var(--ink); }
  body { font: 15px/1.55 Inter, system-ui, sans-serif; }
  a { color: inherit; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }
  .small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Scroll track that drives the walk through the doorway. */
  .travel { position: relative; height: 260vh; }
  .hero { position: sticky; top: 0; height: 100svh; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; color: #ece8e1; pointer-events: none; }
  .hero a { pointer-events: auto; }
  .hero .bar { display: flex; justify-content: space-between; gap: 16px; }
  .hero nav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: flex-end; }
  .hero nav a { text-decoration: none; opacity: .8; }
  .hero nav a:hover { opacity: 1; }
  .hero h1 { margin: 0; font-size: clamp(54px, 10vw, 150px); line-height: .9; letter-spacing: -.02em; }
  .hero h1 i { opacity: .7; }
  .hero p { margin: 14px 0 0; max-width: 28em; opacity: .75; }

  main { position: relative; padding: 0 16px 16px; display: grid; gap: 16px; justify-items: center; }
  .card { width: min(880px, 100%); background: var(--card); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); padding: clamp(22px, 4vw, 44px); border-radius: 3px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
  .card + .card { margin-top: 30vh; }
  .card:first-child { margin-top: 10vh; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 22px; }
  h2 { margin: 0; font-size: clamp(36px, 5vw, 60px); line-height: 1; }
  h3 { margin: 0 0 6px; font-weight: 600; font-size: 16px; }
  .lede { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; margin: 0 0 26px; }
  .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 28px; margin: 0; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 2px 0 0; }
  .job { display: grid; grid-template-columns: 170px 1fr; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .job ul { margin: 0; padding-left: 18px; }
  .job li { margin: 3px 0; }
  .awards { list-style: none; padding: 0; margin: 22px 0 0; }
  .awards li { display: flex; gap: 18px; padding: 6px 0; }
  .awards span { color: var(--mute); min-width: 3em; }

  .plates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .plate { text-decoration: none; display: block; }
  .plate img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 2px; filter: saturate(.85); transition: filter .3s, transform .3s; }
  .plate:hover img { filter: saturate(1.1); transform: scale(1.02); }
  .plate b { display: block; margin-top: 8px; font-weight: 600; }
  .plate span { color: var(--mute); font-size: 13px; }

  .email { display: block; font-size: clamp(34px, 6vw, 76px); line-height: 1; text-decoration: none; margin: 4px 0 24px; }
  .email:hover { font-style: italic; }
  .links { display: flex; gap: 22px; flex-wrap: wrap; }
  .fine { color: var(--mute); margin-top: 28px; }

  @media (max-width: 720px) {
    .plates { grid-template-columns: 1fr 1fr; }
    .job, .facts { grid-template-columns: 1fr; }
    .hero nav { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<div class="travel">
  <header class="hero" id="hero">
    <div class="bar small"><span>Robbie Laughlen</span>
      <nav><a href="#about">About</a><a href="#work">Work</a><a href="#projects">Projects</a><a href="#music">Music</a><a href="#contact">Contact</a></nav></div>
    <div>
      <h1 class="serif">Robbie<br><i>Laughlen</i></h1>
      <p id="tag"></p>
      <p class="small" style="margin-top:22px">Step outside ↓</p>
    </div>
  </header>
</div>

<main id="content"></main>

<script type="module">
import { site } from "../data.js";
const $ = (s) => document.querySelector(s);
$("#tag").textContent = `${site.tagline}. ${site.location}. Software, physics and sound; most interesting where they overlap.`;

const plate = (p) => `<a class="plate" href="${p.href}" target="_blank" rel="noopener"><img src="${p.img}" alt="${p.title}" loading="lazy"><b>${p.title}</b><span>${p.year} · ${p.stack ?? p.desc}</span></a>`;
$("#content").innerHTML = `
<section class="card" id="about"><header><h2 class="serif">About</h2><span class="small">i.</span></header>
  <p class="lede serif">${site.about}</p>
  <dl class="facts">${site.facts.map(([k, v]) => `<div><dt class="small">${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
</section>

<section class="card" id="work"><header><h2 class="serif">Work</h2><span class="small">ii.</span></header>
  ${site.jobs.map((j) => `<div class="job"><div class="small">${j.when}</div><div><h3>${j.role}, ${j.org}</h3><ul>${j.points.map((p) => `<li>${p}</li>`).join("")}</ul></div></div>`).join("")}
  <ul class="awards">${site.awards.map(([y, a]) => `<li><span>${y}</span>${a}</li>`).join("")}</ul>
</section>

<section class="card" id="projects"><header><h2 class="serif">Projects</h2><span class="small">iii.</span></header>
  <div class="plates">${site.projects.map(plate).join("")}</div>
</section>

<section class="card" id="music"><header><h2 class="serif">Music</h2><span class="small">iv.</span></header>
  <div class="plates">${site.music.map((m) => plate({ ...m, stack: m.desc })).join("")}</div>
</section>

<section class="card" id="contact"><header><h2 class="serif">Contact</h2><span class="small">v.</span></header>
  <a class="email serif" href="mailto:${site.email}">${site.email}</a>
  <div class="links small">${site.links.map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>
  <p class="fine small">© 2025 ${site.name}</p>
</section>`;

// ---------------------------------------------------------------- scene
import * as THREE from "three";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const renderer = new THREE.WebGLRenderer({ canvas: $("#stage"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd3dfea, 40, 1000);
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 9000);

// helpers
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.anisotropy = 8;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const std = (o) => new THREE.MeshStandardMaterial(o);
function add(geo, mat, x, y, z, { cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = receive;
  scene.add(m);
  return m;
}

// --- sky + sun
const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 24), THREE.MathUtils.degToRad(212));
// Gradient dome: cleaner and more "render-y" than a physical sky.
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: { top: { value: new THREE.Color(0x2f6fbf) }, bottom: { value: new THREE.Color(0xd3dfea) }, sunDir: { value: sun } },
    vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; varying vec3 vDir;
      void main() {
        float h = max(vDir.y, 0.0);
        vec3 c = mix(bottom, top, pow(h, 0.32));
        float s = max(dot(normalize(vDir), sunDir), 0.0);
        c += vec3(1.0, 0.96, 0.88) * (pow(s, 600.0) * 4.0 + pow(s, 12.0) * 0.35);
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  })
);
scene.add(sky);

const sunLight = new THREE.DirectionalLight(0xfff0dc, 5.5);
sunLight.position.copy(sun).multiplyScalar(60).add(new THREE.Vector3(0, 0, 2));
sunLight.target.position.set(0, 0, 2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 140 });
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.03;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0xbcd2f2, 0x40602c, 0.55));

// --- the field
const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#57813a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const l = rnd(28, 46);
    g.fillStyle = `hsl(${rnd(85, 105)}, ${rnd(35, 55)}%, ${l}%)`;
    g.fillRect(rnd(0, w), rnd(0, h), 1.5, rnd(2, 6));
  }
}, [500, 500]);
const grass = add(new THREE.PlaneGeometry(3000, 3000), std({ map: grassTex, roughness: 1 }), 0, 0, -1500, { cast: false });
grass.rotation.x = -Math.PI / 2;

// distant hills, pushed blue by fog
for (let i = 0; i < 7; i++) {
  const hill = add(new THREE.SphereGeometry(1, 32, 16), std({ color: 0xa3b0bc, roughness: 1 }), rnd(-700, 700), -8, rnd(-520, -700), { cast: false, receive: false });
  hill.scale.set(rnd(260, 480), rnd(14, 30), rnd(90, 160));
}

// clouds: soft billboard puffs
const puff = canvasTex(256, 256, (g) => {
  for (let i = 0; i < 26; i++) {
    const x = rnd(50, 206), y = rnd(95, 170), r = rnd(25, 60);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(255,255,255,.9)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  // shade the undersides grey-blue, keep tops white
  g.globalCompositeOperation = "source-atop";
  const sh = g.createLinearGradient(0, 90, 0, 220);
  sh.addColorStop(0, "rgba(255,255,255,0)");
  sh.addColorStop(1, "rgba(110,125,148,.9)");
  g.fillStyle = sh; g.fillRect(0, 0, 256, 256);
  g.globalCompositeOperation = "source-over";
});
for (let i = 0; i < 38; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puff, transparent: true, depthWrite: false, fog: false, color: new THREE.Color().setHSL(0.6, 0.15, rnd(0.82, 0.97)) }));
  s.position.set(rnd(-400, 400), rnd(30, 110), rnd(-160, -480));
  const k = rnd(110, 260);
  s.scale.set(k, k * 0.55, 1);
  scene.add(s);
}

// --- figures in the field: simple and slightly uncanny
function figure(robe, hood, x, z, point) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.55, 1.55, 24), robe);
  body.position.y = 0.78;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 16), hood);
  head.position.y = 1.78;
  head.scale.set(1, 1.15, 1);
  g.add(body, head);
  if (point) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 0.95, 12), robe);
    arm.position.set(0.45, 1.38, 0);
    arm.rotation.z = -Math.PI / 2 + 0.12;
    g.add(arm);
  }
  g.traverse((m) => { m.castShadow = m.receiveShadow = true; });
  g.position.set(x, 0, z);
  g.rotation.y = point ? 0.5 : -0.4;
  scene.add(g);
  return g;
}
const stripes = canvasTex(64, 256, (g, w, h) => {
  for (let y = 0; y < h; y += 16) { g.fillStyle = (y / 16) % 2 ? "#e7e2d8" : "#1f2329"; g.fillRect(0, y, w, 16); }
});
figure(std({ color: 0x9db4cc, roughness: 0.9 }), std({ color: 0xc9cdd1, roughness: 0.9 }), -2.2, -26, true);
figure(std({ map: stripes, roughness: 0.9 }), std({ color: 0xa82a2a, roughness: 0.8 }), 2.3, -22.5, false);

// --- the room
const wallpaper = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#3b3833"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(255,255,255,.06)"; g.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const x = rnd(0, w), y = rnd(0, h);
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 30, y - 40, x + 60, y + 10, x + 90, y - 30); g.stroke();
    g.beginPath(); g.ellipse(x + 45, y - 18, 10, 4, 0.6, 0, Math.PI * 2); g.stroke();
  }
}, [3, 2]);
const wallMat = std({ map: wallpaper, roughness: 0.9 });
const W = 6.5, H = 4.6, DW = 1.6, DH = 3.8, T = 0.3;
add(new THREE.BoxGeometry(W - DW, H, T), wallMat, -(W + DW) / 2, H / 2, -T / 2);
add(new THREE.BoxGeometry(W - DW, H, T), wallMat, (W + DW) / 2, H / 2, -T / 2);
add(new THREE.BoxGeometry(DW * 2, H - DH, T), wallMat, 0, DH + (H - DH) / 2, -T / 2);
const side = (x, ry) => { const m = add(new THREE.PlaneGeometry(14, H), wallMat, x, H / 2, 7, { cast: false }); m.rotation.y = ry; };
side(-W, Math.PI / 2);
side(W, -Math.PI / 2);
const ceil = add(new THREE.PlaneGeometry(W * 2, 14), std({ color: 0x1a1917, roughness: 1 }), 0, H, 7);
ceil.rotation.x = Math.PI / 2;

// door frame trim
const trim = std({ color: 0x8f8884, roughness: 0.6 });
add(new THREE.BoxGeometry(0.12, DH + 0.12, T + 0.06), trim, -DW - 0.06, DH / 2, -T / 2);
add(new THREE.BoxGeometry(0.12, DH + 0.12, T + 0.06), trim, DW + 0.06, DH / 2, -T / 2);
add(new THREE.BoxGeometry(DW * 2 + 0.24, 0.12, T + 0.06), trim, 0, DH + 0.06, -T / 2);

// wood floor
const wood = canvasTex(1024, 1024, (g, w, h) => {
  const pw = w / 8;
  for (let i = 0; i < 8; i++) {
    let y = 0;
    while (y < h) {
      const len = rnd(220, 520);
      g.fillStyle = `hsl(${rnd(22, 30)}, ${rnd(30, 42)}%, ${rnd(18, 27)}%)`;
      g.fillRect(i * pw, y, pw - 2, len - 2);
      g.strokeStyle = "rgba(0,0,0,.18)";
      for (let k = 0; k < 9; k++) { g.beginPath(); const gx = i * pw + rnd(4, pw - 6); g.moveTo(gx, y); g.lineTo(gx + rnd(-4, 4), y + len); g.stroke(); }
      y += len;
    }
  }
}, [2, 2]);
const floor = add(new THREE.PlaneGeometry(W * 2, 14.4), std({ map: wood, roughness: 0.38, metalness: 0 }), 0, 0.001, 6.9, { cast: false });
floor.rotation.x = -Math.PI / 2;

// stone step outside
const tiles = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#77746f"; g.fillRect(0, 0, w, h);
  const s = w / 4;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    g.fillStyle = `hsl(30, 4%, ${rnd(52, 62)}%)`;
    g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
  }
}, [3, 1]);
const step = add(new THREE.BoxGeometry(DW * 2 + 1.4, 0.06, 3), std({ map: tiles, roughness: 0.55 }), 0, 0.03, -T - 1.5, { cast: false });

// doors, swung outward
function door(hingeX, dir) {
  const pivot = new THREE.Group();
  pivot.position.set(hingeX, 0, -T);
  const mat = std({ color: 0x8b7f7c, roughness: 0.55 });
  const slab = new THREE.Mesh(new THREE.BoxGeometry(DW - 0.04, DH - 0.04, 0.06), mat);
  slab.position.set(dir * (DW / 2), DH / 2, 0);
  pivot.add(slab);
  for (const [py, ph] of [[1.05, 1.5], [2.85, 1.3]]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(DW - 0.42, ph, 0.09), mat);
    p.position.set(dir * (DW / 2), py, 0);
    pivot.add(p);
  }
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), std({ color: 0xcfcfcf, metalness: 1, roughness: 0.25 }));
  knob.position.set(dir * (DW - 0.14), 1.6, 0.07);
  pivot.add(knob);
  pivot.traverse((m) => { m.castShadow = m.receiveShadow = true; });
  pivot.rotation.y = dir * 1.25;
  scene.add(pivot);
}
door(-DW, 1);
door(DW, -1);

// cardboard boxes by the door
const card = std({ color: 0x5f4430, roughness: 0.95 });
add(new THREE.BoxGeometry(1.15, 0.62, 0.85), card, -4.9, 0.31, 1.4).rotation.y = 0.08;
add(new THREE.BoxGeometry(1.0, 0.55, 0.75), card, -4.85, 0.9, 1.35).rotation.y = -0.05;
add(new THREE.BoxGeometry(0.42, 0.01, 0.26), std({ color: 0xe9e6df, roughness: 0.8 }), -4.8, 1.18, 1.3).rotation.y = 0.3;

// faint bounce inside so the room isn't pure black
const bounce = new THREE.PointLight(0xffe2c4, 6, 14, 1.4);
bounce.position.set(0, 3.2, 3.5);
scene.add(bounce);

// ---------------------------------------------------------------- loop
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // keep the doorway framed on tall screens
  camera.fov = camera.aspect < 0.8 ? 62 : 42;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const pointer = { x: 0, y: 0 };
addEventListener("pointermove", (e) => { pointer.x = e.clientX / innerWidth - 0.5; pointer.y = e.clientY / innerHeight - 0.5; });

const ease = (x) => x * x * (3 - 2 * x);
const look = new THREE.Vector3();
const hero = $("#hero");
const clock = new THREE.Clock();
let cur = 0;

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const track = document.querySelector(".travel").offsetHeight - innerHeight;
  const target = Math.min(Math.max(scrollY / track, 0), 1);
  cur += (target - cur) * (reduce ? 1 : 0.06);
  const p = ease(cur);

  const sway = reduce ? 0 : 1;
  camera.position.set(
    pointer.x * 0.35 * sway + Math.sin(t * 0.35) * 0.04 * sway,
    1.7 - pointer.y * 0.15 * sway + Math.sin(t * 0.5) * 0.02 * sway,
    THREE.MathUtils.lerp(9.5, -3.5, p)
  );
  look.set(pointer.x * 1.2 * sway, THREE.MathUtils.lerp(1.55, 2.6, p), camera.position.z - 20);
  camera.lookAt(look);

  hero.style.opacity = String(Math.max(0, 1 - cur * 2.2));
  renderer.render(scene, camera);
});
</script>
</body>
</html>
